<div class="publicaion mb-4" >
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2 text-dark">
        <div class="avatar-vircle"> {{ publicacion().email_autor | emailAvatar }}
          <span class="fw-bold d-block small">{{ publicacion().email_autor}}</span>
        </div>
        <button 
          class="btn btn-outline-dark p-1 border-0" 
          title="Eliminar publicacion"
          [disabled]="!hayUsuario() || !puedeEliminar()"
          (click)="confirmarModal()"
        >
          <i class="bi bi-trash3"></i>
        </button>
      </div>
      <div class="d-flex justify-content-between align-items-baseline mb-2">
      <h5 class="card-title fw-bold mb-0">{{ publicacion().titulo }}</h5>
      <small class="text-muted" style="font-size: 0.8rem;">
        {{ publicacion().fecha_publicacion | fechaPipe }}
      </small>
      </div>
      <p class="card-text text-muted">
        {{ publicacion().contenido }}
      </p>
    </div>
    @if (publicacion().imagen_url) {
      <img
        [src]="publicacion().imagen_url"
        class="card-img-bottom img-fluid"
        alt="Imagen de la publicacion"
      />
    }

    <div class="card-footer bg-transparent d-flex justify-content-between align-items-center py-2">
      <button
        class="btn btn-link text-decoration-none text-reset p-0 d-flex align-items-center"
        [disabled]="!hayUsuario()"
        (click)="toggleLike()"
      >
        <i
          class="bi"
          [class.bi-heart-fill]="hasLike()"
          [class.text-danger]="hasLike()"
          [class.bi-heart]="!hasLike()"
        ></i>
        <span class="ms-2 fw-semibold" [class.text-danger]="hasLike()">
          {{ hasLike() ? 'Te gusta' : 'Me gusta' }}
        </span>
        <small class="text-muted ms-1">({{ likes() }})</small>
      </button>

      <button class="btn btn-outline-dark btn-sm" (click)="mostrarEnPantallaCompleta()">
        Ver en pantalla completa
      </button>
    </div>
  </div>
</div>

<app-modal
  [flagAbrir]="mostrarModal()"
  [tituloModal]="tituloModal()"
  [textoModal]="textoModal()"
  [flagModalBoton]="flagModalBoton()"
  (cerrarModal)="mostrarModal.set(false)"   
  (confirmarModal)="eliminarPublicacion()"
></app-modal>
