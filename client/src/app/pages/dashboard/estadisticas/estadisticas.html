<div class="dashboard-container">
  <h2>Panel de Estadisticas</h2>
<hr/>
  <div class="filter-range row mb-4" >
    <div class="col-auto d-flex gap-3">
      <label>Desde: <input type="date" [ngModel]="fechaInicio()" (ngModelChange)="fechaInicio.set($event)"></label>
      <label>Hasta: <input type="date" [ngModel]="fechaFin()" (ngModelChange)="fechaFin.set($event)"></label>
    </div>
  </div>

  <div class="charts-grid row g-4 justify-content-center">
    
    <div class="col-12 col-md-6">
      <div class="chart-card card p-3">
        <h3 class="h6 text-center text-white mb-3">
          Publicaciones por Autor
        </h3>
        <canvas #graficoBarras></canvas>
      </div>
    </div>
    
    <div class="col-12 col-md-6">
      <div class="chart-card card p-3">
        <h3 class="h6 text-center text-white mb-3">
          Cantidad de comentarios por fecha
        </h3>
        <canvas #graficoLineal></canvas>
      </div>
    </div>

    <div class="col-12 col-md-6">
      <div class="chart-card card p-3 mx-auto">
        <h3 class="h6 text-center text-white mb-3">
          Comentarios por publicacion
        </h3>
        <canvas #graficoTorta></canvas>
      </div>
    </div>


  </div>
</div>
